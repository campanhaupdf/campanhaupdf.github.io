<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UP — Organização</title><link rel="stylesheet" href="style.css">
<style>.admin{padding:45px 0;width:min(1200px,94%);margin:auto}.admin h1{font-family:Anton,Impact,sans-serif;font-size:62px;margin:0}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:20px 0}.panel{background:#fff;border:3px solid #111;padding:20px;box-shadow:7px 7px 0 #d71920}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th{background:#111;color:#fff;text-align:left}.table th,.table td{padding:11px;border-bottom:1px solid #ddd}.whats{font-weight:900;color:#d71920}@media(max-width:700px){.filters{grid-template-columns:1fr}}</style>
</head><body><header class="site-header"><div class="header-inner"><a class="up-logo" href="/">UP</a><div class="brand"><strong>UNIDADE POPULAR</strong><span>ORGANIZAÇÃO</span></div><div class="number">80</div></div></header>
<main class="admin"><h1>PANFLETAGEM</h1><p>Central de disponibilidade da campanha.</p><div class="panel"><strong id="count">0 CADASTROS</strong><div class="filters"><input id="q" placeholder="Nome, região ou local"><select id="d"><option value="">Todos os dias</option><option>Segunda</option><option>Terça</option><option>Quarta</option><option>Quinta</option><option>Sexta</option><option>Sábado</option><option>Domingo</option></select><select id="h"><option value="">Todos os horários</option><option>Manhã</option><option>Tarde</option><option>Noite</option></select></div><div class="tablewrap"><table class="table"><thead><tr><th>Nome</th><th>WhatsApp</th><th>Região</th><th>Local</th><th>Dias</th><th>Horário</th><th>Observações</th></tr></thead><tbody id="tbody"></tbody></table></div><p id="status" class="status"></p></div></main>
<script src="config.js"></script><script>
let rows=[];const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function render(){let q=$("q").value.toLowerCase(),d=$("d").value,h=$("h").value;let a=rows.filter(x=>(!q||`${x.nome} ${x.regiao} ${x.local}`.toLowerCase().includes(q))&&(!d||(x.dias||"").includes(d))&&(!h||(x.horarios||"").includes(h)));$("count").textContent=`${a.length} CADASTRO(S)`;$("tbody").innerHTML=a.map(x=>`<tr><td>${esc(x.nome)}</td><td><a class="whats" target="_blank" href="https://wa.me/${String(x.whatsapp||"").replace(/\D/g,"")}">ABRIR WHATSAPP</a><br>${esc(x.whatsapp)}</td><td>${esc(x.regiao)}</td><td>${esc(x.local)}</td><td>${esc(x.dias)}</td><td>${esc(x.horarios)} ${x.horario_especifico?"— "+esc(x.horario_especifico):""}</td><td>${esc(x.observacoes)}</td></tr>`).join("")}async function load(){try{let r=await fetch(`${SUPABASE_URL}/rest/v1/disponibilidades?select=*&order=created_at.desc`,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:`Bearer ${SUPABASE_ANON_KEY}`}});if(!r.ok)throw 0;rows=await r.json();render()}catch(e){$("status").textContent="Erro ao carregar os dados. Configure o Supabase e a autenticação do painel."}}["q","d","h"].forEach(x=>$(x).addEventListener("input",render));load();
</script></body></html>
